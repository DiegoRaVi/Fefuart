<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/forms.css" />
    <script src="../config/config.js"></script>
    <script src="../js/main.js" type="module"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>
    <main>
      <h1>Live Art</h1>

      <div class="product-description">
        <p class="product-description-text">
          Rellena este formulario con tus datos y
          cuéntanos qué tipo de ilustración quieres. Nos pondremos en contacto
          contigo para confirmar los detalles y darte fecha para tu experiencia
          de arte en vivo.<br><br>¡Tu idea se convierte en arte en tiempo real!
        </p>
        <img src="../img/fefuart-img/Ramos/ramo.jpg" alt="" />
        
      </div>

      <h2 style="font-weight: bold;">Rellene el formulario</h2>
      <form id="form-live-art">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-group">
          <label for="quantity">Unidades</label>
          <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            value="1"
            required
          />
        </div>

        <div class="form-group">
          <label for="address">Dirección de envío</label>
          <input type="text" id="address" name="address" required />
        </div>

        <div class="form-group">
          <label for="envio">Tipo de envío</label>
          <select name="envio" id="envio">
            <option value="physical">Físico (5€)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="image">Imagen</label>
          <input type="file" id="image" name="image" required />
        </div>

        <div class="form-group">
          <p id="precio"></p>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </main>
    <div id="footer-placeholder"></div>
  </body>
</html>
