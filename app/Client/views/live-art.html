<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/forms.css" />
    <script src="../config/config.js"></script>
    <script src="../js/main.js" type="module"></script>
  </head>
  <body>
    <div id="header-placeholder"></div>
    <main>
      <h1>Live Art</h1>

      <div class="product-description">
        <p class="product-description-text">
          Rellena este formulario con tus datos y cuéntanos qué tipo de
          ilustración quieres. Nos pondremos en contacto contigo para confirmar
          los detalles y darte fecha para tu experiencia de arte en vivo.<br /><br />¡Tu
          idea se convierte en arte en tiempo real!
        </p>
        <img src="../img/fefuart-img/Live-art/26.jpg" alt="" />
      </div>

      <h2>Rellene el formulario</h2>
      <form id="form-live-art">
        <div class="form-group">
          <label for="title">Título</label>
          <input type="text" id="title" name="title" required />
        </div>

        <div class="form-group">
          <label for="description">Descripción</label>
          <textarea id="description" name="description"></textarea>
        </div>

        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input type="text" id="phone" name="phone" required />
        </div>

        <div class="form-group">
          <label for="date">Fecha</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="form-group">
          <label for="location">Lugar del evento</label>
          <input type="text" id="location" name="location" />
        </div>

        <div class="form-group">
          <label for="schedule">Horario</label>
          <select name="schedule" id="schedule">
            <option value="morning">Mañana</option>
            <option value="evening">Tarde</option>
          </select>
        </div>

        <button type="submit">Enviar</button>
      </form>
    </main>
    <div id="footer-placeholder"></div>
  </body>
  <script type="module">
    import { getUser, isAuthenticated } from "../js/auth.js";
    import { cart } from "../js/order.js";

    document.addEventListener("DOMContentLoaded", async () => {
      const form = document.getElementById("form-live-art");
      const title = document.getElementById("title");
      const description = document.getElementById("description");
      const phone = document.getElementById("phone");
      const date = document.getElementById("date");
      const place = document.getElementById("location");

      try {
        // Intentar obtener la cart order existente

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          if (!isAuthenticated()) {
            location.href = "./login.html";
            return;
          }

          const formData = new FormData();

          formData.append("title", document.getElementById("title").value);
          formData.append(
            "description",
            document.getElementById("description").value
          );
          formData.append("phone", document.getElementById("phone").value);
          formData.append("date", document.getElementById("date").value);
          formData.append(
            "location",
            document.getElementById("location").value
          );
          formData.append(
            "schedule",
            document.getElementById("schedule").value
          );

          try {
            const response = await fetch(API_URL + "/events", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
              body: formData,
            });

            if (response.status === 401) {
              localStorage.removeItem("token");
              localStorage.removeItem("role");
              location.href = "./login.html";
              return;
            }

            const result = await response.json();

            if (response.ok) {
              console.log("Evento enviado con éxito!");
              console.log(phone.value);
            } else {
              console.error(result);
              alert("Error al enviar el evento");
            }
          } catch (error) {
            console.error(error);
            alert("Hubo un error al enviar la solicitud.");
          }
        });
      } catch (error) {
        console.error("Error en la inicialización del formulario:", error);
        alert("Hubo un problema al cargar la página. Inténtalo más tarde.");
      }
    });
  </script>
</html>
