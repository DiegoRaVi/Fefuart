<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fefuart</title>
    <script src="../config/config.js"></script>
    <script type="module" src="../js/auth.js" defer></script>
    <script type="module" src="../js/main.js" defer></script>
  </head>
  <body style="background-color: gray">
    <div id="header-placeholder" style="background-color: lightcoral"></div>

    <div
      id="thanks-modal"
      style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      "
    >
      <div
        style="
          background: #fff;
          padding: 2rem;
          border-radius: 8px;
          text-align: center;
          position: relative;
        "
      >
        <h2>Gracias por su compra</h2>
        <button id="close-modal" style="margin-top: 1rem">Cerrar</button>
      </div>
    </div>
  </body>
</html>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const shouldShow = localStorage.getItem("showThanksModal");
    if (shouldShow === "true") {
      document.getElementById("thanks-modal").style.display = "flex";
      localStorage.removeItem("showThanksModal"); // Evita que vuelva a salir
    }

    document.getElementById("close-modal").addEventListener("click", () => {
      document.getElementById("thanks-modal").style.display = "none";
    });
  });
</script>
